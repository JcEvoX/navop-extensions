[package]
name = "clickhouse_driver"
version = "0.1.0"
edition = "2024"

# 扩展二进制名与 extension.build.json / driver.json entry 保持一致(clickhouse-ipc-driver)。
[[bin]]
name = "clickhouse-ipc-driver"
path = "src/main.rs"

[lib]
name = "clickhouse_driver"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
extension-driver.workspace = true
extension-protocol.workspace = true
interprocess.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# 官方 ClickHouse HTTP 客户端(JSONCompact 取数 + DDL/DML 执行)。
clickhouse.workspace = true

[dev-dependencies]
extension-host.workspace = true
tempfile = "3"
