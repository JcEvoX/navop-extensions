[package]
name = "navop-rdp-helper"
version = "0.3.16"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
# Keep the RDP client compatible with legacy servers such as Windows Server 2008 R2.
# native-tls 0.2.15+ defaults to a TLS 1.2 minimum, while these servers may only
# offer TLS 1.0. This direct dependency constrains IronRDP's transitive native-tls
# dependency without changing its backend.
native-tls = "=0.2.14"
ironrdp = { git = "https://github.com/feigeCode/IronRDP", rev = "2f21397d8b83ae516981cccbd299f5389c1914ec", features = [
    "connector",
    "cliprdr",
    "graphics",
    "input",
    "pdu",
] }
ironrdp-client = { git = "https://github.com/feigeCode/IronRDP", rev = "2f21397d8b83ae516981cccbd299f5389c1914ec", default-features = false, features = [
    "clipboard",
    "native-tls",
    "sound",
] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whoami = "1"
